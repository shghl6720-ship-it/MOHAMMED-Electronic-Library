<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة محمد الإلكترونية - بوابة الأعضاء</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #070a12;
            --card-bg: #0e1526;
            --card-border: #1a253e;
            --primary-blue: #2563eb;
            --primary-purple: #6d28d9;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --chip-bg: #131c31;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            direction: rtl;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* الهيدر */
        header {
            background-color: rgba(14, 21, 38, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--card-border);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 12px 0;
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .logo-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-avatar {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #1d4ed8, #3b82f6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 0 15px rgba(37, 99, 235, 0.4);
        }

        .logo-text h2 {
            font-size: 18px;
            font-weight: 700;
        }

        .logo-text span {
            font-size: 11px;
            color: var(--text-muted);
            display: block;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            border: 1px solid transparent;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .btn-outline {
            background: var(--chip-bg);
            border-color: var(--card-border);
            color: var(--text-main);
        }

        .btn-outline:hover {
            border-color: var(--primary-blue);
            background: #18233c;
        }

        .btn-primary {
            background: var(--primary-blue);
            color: #fff;
        }

        .btn-primary:hover {
            background: #1d4ed8;
            box-shadow: 0 0 15px rgba(37, 99, 235, 0.4);
        }

        /* نافذة تسجيل الدخول (Modal) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            width: 100%;
            max-width: 420px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            position: relative;
        }

        .close-modal {
            position: absolute;
            top: 15px;
            left: 15px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
        }

        .modal-title {
            font-size: 20px;
            margin-bottom: 20px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            padding: 10px 14px;
            background: #080d1a;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            color: #fff;
            outline: none;
            font-size: 14px;
        }

        .form-input:focus {
            border-color: var(--primary-blue);
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: var(--primary-blue);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        /* بوابة الأعضاء (User Profile Widget) */
        .user-profile {
            display: none;
            align-items: center;
            gap: 10px;
            background: var(--chip-bg);
            padding: 6px 14px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            background: var(--primary-purple);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <!-- الهيدر -->
    <header>
        <div class="container nav-container">
            <div class="logo-group">
                <div class="logo-avatar">ME</div>
                <div class="logo-text">
                    <h2>مكتبة محمد الإلكترونية</h2>
                    <span>اقرأ، تعلم، وتوسع</span>
                </div>
            </div>

            <div class="nav-actions">
                <!-- أزرار الزائر -->
                <div id="guest-actions" style="display: flex; gap: 8px;">
                    <button class="btn btn-outline" onclick="openModal('login')"><i class="fa-solid fa-right-to-bracket"></i> تسجيل الدخول</button>
                    <button class="btn btn-primary" onclick="openModal('register')"><i class="fa-solid fa-user-plus"></i> إنشاء حساب جديد</button>
                </div>

                <!-- بوابة العضو (تظهر بعد الدخول) -->
                <div id="user-actions" class="user-profile">
                    <div class="user-avatar" id="user-initials">U</div>
                    <span id="user-name" style="font-size: 13px; font-weight: 600;">المستخدم</span>
                    <button class="btn btn-outline" style="padding: 4px 8px; font-size: 11px;" onclick="logout()"><i class="fa-solid fa-power-off"></i> خروج</button>
                </div>
            </div>
        </div>
    </header>

    <!-- نافذة تسجيل الدخول / التسجيل -->
    <div class="modal-overlay" id="authModal">
        <div class="modal-card">
            <button class="close-modal" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            <h3 class="modal-title" id="modalTitle">تسجيل الدخول</h3>

            <form id="authForm" onsubmit="handleAuth(event)">
                <div class="form-group" id="nameGroup" style="display: none;">
                    <label>الاسم الكامل</label>
                    <input type="text" id="fullName" class="form-input" placeholder="محمد أحمد">
                </div>

                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="email" class="form-input" required placeholder="user@domain.com">
                </div>

                <div class="form-group">
                    <label>كلمة السر</label>
                    <input type="password" id="password" class="form-input" required placeholder="••••••••">
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">دخول</button>
            </form>
        </div>
    </div>

    <script>
        let currentMode = 'login';

        function openModal(mode) {
            currentMode = mode;
            const modal = document.getElementById('authModal');
            const title = document.getElementById('modalTitle');
            const nameGroup = document.getElementById('nameGroup');
            const submitBtn = document.getElementById('submitBtn');

            if (mode === 'register') {
                title.innerText = 'إنشاء حساب جديد';
                nameGroup.style.display = 'block';
                submitBtn.innerText = 'إنشاء الحساب';
            } else {
                title.innerText = 'تسجيل الدخول';
                nameGroup.style.display = 'none';
                submitBtn.innerText = 'دخول';
            }
            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('authModal').style.display = 'none';
        }

        async function handleAuth(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const fullName = document.getElementById('fullName').value;

            const endpoint = currentMode === 'register' ? '/api/register' : '/api/login';
            const payload = currentMode === 'register' ? { fullName, email, password } : { email, password };

            try {
                const response = await fetch(`http://localhost:3000${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    checkAuthStatus();
                    closeModal();
                    alert(data.message);
                } else {
                    alert(data.error || 'حدث خطأ أثناء العملية');
                }
            } catch (err) {
                alert('عذراً، تعذر الاتصال بالخادم.');
            }
        }

        function checkAuthStatus() {
            const user = JSON.parse(localStorage.getItem('user'));
            if (user) {
                document.getElementById('guest-actions').style.display = 'none';
                document.getElementById('user-actions').style.display = 'flex';
                document.getElementById('user-name').innerText = user.fullName;
                document.getElementById('user-initials').innerText = user.fullName.charAt(0).toUpperCase();
            } else {
                document.getElementById('guest-actions').style.display = 'flex';
                document.getElementById('user-actions').style.display = 'none';
            }
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            checkAuthStatus();
        }

        // التحقق عند تحميل الصفحة
        window.onload = checkAuthStatus;
    </script>
</body>
</html>
